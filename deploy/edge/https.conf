upstream cell_api {
    server api:3018;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    location = /edge-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://118.196.108.188$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 118.196.108.188;

    ssl_certificate /etc/letsencrypt/live/tsp-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tsp-edge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://cell_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }
}
