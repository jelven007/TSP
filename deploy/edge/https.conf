upstream full_api {
    zone full_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    server tsp-full-api:3018 resolve;
    keepalive 32;
}

upstream realtime_gateway {
    zone realtime_gateway 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    server tsp-full-gateway:3018 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    location = /edge-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://118.196.108.188$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 118.196.108.188;

    ssl_certificate /etc/tsp-edge/tls/fullchain.pem;
    ssl_certificate_key /etc/tsp-edge/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /api/events {
        proxy_pass http://realtime_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location = /api/events/ticket {
        proxy_pass http://realtime_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://full_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }
}
