# Each deployment supplies external PostgreSQL endpoints using runtime-only roles.
# Use a different data database cluster for every Cell in production.
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/cell/Dockerfile
    image: tsp-cell-api:local
    environment:
      TSP_CELL_ID: ${TSP_CELL_ID:?Cell ID required}
      TSP_CELL_CONTROL_DSN: ${TSP_CELL_CONTROL_DSN:?Runtime control DSN required}
      TSP_CELL_DATA_DSN: ${TSP_CELL_DATA_DSN:?Runtime data DSN required}
      TSP_CELL_POOL_SIZE: ${TSP_CELL_POOL_SIZE:-4}
      TSP_CELL_MARKET_URL: ${TSP_CELL_MARKET_URL:-}
      TSP_CELL_MARKET_TOKEN: ${TSP_CELL_MARKET_TOKEN:-}
      TSP_CELL_CORS_ORIGINS: ${TSP_CELL_CORS_ORIGINS:-[]}
      TSP_CELL_SMTP_HOST: ${TSP_CELL_SMTP_HOST:-}
      TSP_CELL_SMTP_FROM: ${TSP_CELL_SMTP_FROM:-}
      TSP_CELL_WEBHOOK_ORIGINS: ${TSP_CELL_WEBHOOK_ORIGINS:-[]}
    ports:
      - "127.0.0.1:${TSP_CELL_PORT:-3020}:3018"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1
  worker:
    &worker
    profiles: [worker]
    build:
      context: ../..
      dockerfile: deploy/cell/Worker.Dockerfile
    image: tsp-cell-worker:local
    environment:
      TSP_CELL_ID: ${TSP_CELL_ID:?Cell ID required}
      TSP_CELL_CONTROL_DSN: ${TSP_CELL_CONTROL_DSN:?Runtime control DSN required}
      TSP_CELL_DATA_DSN: ${TSP_CELL_DATA_DSN:?Runtime data DSN required}
      TSP_CELL_MARKET_URL: ${TSP_CELL_MARKET_URL:-}
      TSP_CELL_MARKET_TOKEN: ${TSP_CELL_MARKET_TOKEN:-}
      TSP_CELL_POOL_SIZE: ${TSP_CELL_REALTIME_POOL_SIZE:-16}
      TSP_CELL_WORKER_KIND: realtime
      TSP_CELL_WORKER_CONCURRENCY: ${TSP_CELL_REALTIME_CONCURRENCY:-32}
      TSP_CELL_REALTIME_INTERVAL: ${TSP_CELL_REALTIME_INTERVAL:-1}
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 2g
    cpus: 2
  strategy-worker:
    <<: *worker
    environment:
      TSP_CELL_ID: ${TSP_CELL_ID:?Cell ID required}
      TSP_CELL_CONTROL_DSN: ${TSP_CELL_CONTROL_DSN:?Runtime control DSN required}
      TSP_CELL_DATA_DSN: ${TSP_CELL_DATA_DSN:?Runtime data DSN required}
      TSP_CELL_MARKET_URL: ${TSP_CELL_MARKET_URL:-}
      TSP_CELL_MARKET_TOKEN: ${TSP_CELL_MARKET_TOKEN:-}
      TSP_CELL_POOL_SIZE: 2
      TSP_CELL_WORKER_KIND: strategies
      TSP_CELL_WORKER_CONCURRENCY: ${TSP_CELL_STRATEGY_CONCURRENCY:-2}
  automation-worker:
    <<: *worker
    environment:
      TSP_CELL_ID: ${TSP_CELL_ID:?Cell ID required}
      TSP_CELL_CONTROL_DSN: ${TSP_CELL_CONTROL_DSN:?Runtime control DSN required}
      TSP_CELL_DATA_DSN: ${TSP_CELL_DATA_DSN:?Runtime data DSN required}
      TSP_CELL_MARKET_URL: ${TSP_CELL_MARKET_URL:-}
      TSP_CELL_MARKET_TOKEN: ${TSP_CELL_MARKET_TOKEN:-}
      TSP_CELL_POOL_SIZE: 2
      TSP_CELL_WORKER_KIND: automation
      TSP_CELL_WORKER_CONCURRENCY: 2
  notification-worker:
    <<: *worker
    environment:
      TSP_CELL_ID: ${TSP_CELL_ID:?Cell ID required}
      TSP_CELL_CONTROL_DSN: ${TSP_CELL_CONTROL_DSN:?Runtime control DSN required}
      TSP_CELL_DATA_DSN: ${TSP_CELL_DATA_DSN:?Runtime data DSN required}
      TSP_CELL_MARKET_URL: ${TSP_CELL_MARKET_URL:-}
      TSP_CELL_MARKET_TOKEN: ${TSP_CELL_MARKET_TOKEN:-}
      TSP_CELL_POOL_SIZE: 2
      TSP_CELL_WORKER_KIND: notifications
      TSP_CELL_WORKER_CONCURRENCY: 2
      TSP_CELL_SMTP_HOST: ${TSP_CELL_SMTP_HOST:-}
      TSP_CELL_SMTP_PORT: ${TSP_CELL_SMTP_PORT:-465}
      TSP_CELL_SMTP_USER: ${TSP_CELL_SMTP_USER:-}
      TSP_CELL_SMTP_PASSWORD: ${TSP_CELL_SMTP_PASSWORD:-}
      TSP_CELL_SMTP_FROM: ${TSP_CELL_SMTP_FROM:-}
      TSP_CELL_SMTP_SECURITY: ${TSP_CELL_SMTP_SECURITY:-tls}
      TSP_CELL_WEBHOOK_ORIGINS: ${TSP_CELL_WEBHOOK_ORIGINS:-[]}
