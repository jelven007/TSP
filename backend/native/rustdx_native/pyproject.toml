[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "tsp-rustdx-native"
version = "0.3.0"
requires-python = ">=3.11"
description = "TSP native bridge for jelven-rustdx-complete"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
module-name = "tsp_rustdx_native"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the local wheel when its Rust dependency or source changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "build.rs" },
    { file = "vendor/rustdx-core/src/**/*.rs" },
    { file = "vendor/rustdx-core/tests/fixtures/**/*" },
    { file = "vendor/rustdx-core/*.toml" },
    { file = "vendor/rustdx-core/*.lock" },
    { file = "vendor/rustdx-core/*.json" },
    { file = "vendor/rustdx-core/*.md" },
    { file = "vendor/rustdx-core/LICENSE" },
    { file = "vendor/rustdx-core/SOURCE-SHA256SUMS" },
]
