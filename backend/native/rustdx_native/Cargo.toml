[package]
name = "tsp-rustdx-native"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
name = "tsp_rustdx_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25" }
rustdx_complete = { package = "jelven-rustdx-complete", version = "=2.0.4", path = "vendor/rustdx-core" }
serde = "1"
serde_json = "1"
chrono = "0.4"

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
