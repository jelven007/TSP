  <text x="310" y="136" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="42" font-weight="700" fill="#ffffff">RunningHub <tspan fill="url(#rGrad)">API</tspan></text>

  <rect x="740" y="100" width="196" height="44" rx="22" fill="none" stroke="#b8f51e" stroke-opacity="0.55"/>
  <text x="838" y="129" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#d7f75a">400+ 主流大模型</text>

