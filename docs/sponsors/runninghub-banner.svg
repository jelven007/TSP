      <stop offset="0" stop-color="#b8f51e"/>
      <stop offset="1" stop-color="#f6ffc4"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8f51e"/>
