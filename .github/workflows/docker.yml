name: Build and Push Docker Image

# 触发:
#   - main 的 CI 成功: 固定版本与 SHA，仍为当前 main 时再提升 latest
#   - 打 v* tag / 手动: 先在本 workflow 重跑质量门, 再构建镜像
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-quality:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: uv sync --extra dev --extra cell --frozen
      - run: uv run --frozen --no-sync python -m app.plugins.rustdx.client
      - run: cargo test --locked --manifest-path native/rustdx_native/Cargo.toml
      - run: uv run --frozen --no-sync pytest tests -q

  frontend-quality:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  build-and-push:
    needs: [backend-quality, frontend-quality]
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          needs.backend-quality.result == 'success' &&
          needs.frontend-quality.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download tested CI revision
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: ci-revision
          path: ${{ runner.temp }}/ci-revision
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Select build revision
        id: revision
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            revision="$(cat "$RUNNER_TEMP/ci-revision/revision.txt")"
          else
            revision="$GITHUB_SHA"
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing or invalid tested CI revision"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.revision }}
          persist-credentials: false

      - name: Read application version
        id: application-version
        run: |
          python3 scripts/check_version.py --current VERSION
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.revision.outputs.revision }}
            type=raw,value=${{ steps.application-version.outputs.version }},enable=${{ github.event_name == 'workflow_run' }}
            type=sha,prefix=,enable=${{ github.event_name != 'workflow_run' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.revision }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # GitHub runner 在海外, 关掉国内镜像源(USE_CN_MIRROR=0)
          # 让构建直连官方 npm/PyPI, 反而更快更稳;
          # 本地/国内手动 docker build 仍走 Dockerfile 默认的 CN 镜像。
          build-args: |
            USE_CN_MIRROR=0
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-latest:
    needs: build-and-push
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    # 仅可变指针串行化；版本镜像构建仍独立运行，不取消其他版本构建。
    concurrency:
      group: docker-latest-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 仅将当前主线的镜像提升为 latest
        env:
          BUILD_REVISION: ${{ needs.build-and-push.outputs.revision }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from prepare_release import is_current_main
          revision = os.environ["BUILD_REVISION"]
          if is_current_main(Path.cwd(), revision):
              image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
              subprocess.run([
                  "docker", "buildx", "imagetools", "create",
                  "--tag", image + ":latest", image + ":" + revision,
              ], check=True)
          else:
              print("main has advanced; keep the version image without replacing latest")
          PY
