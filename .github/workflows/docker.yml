name: Build Release Images

# Main calls this after version allocation, concurrently with quality jobs.
# Tag/manual builds run the same frozen revision's quality gates before promotion.
on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
    outputs:
      runtime_digest:
        value: ${{ jobs.runtime.outputs.digest }}
      compute_digest:
        value: ${{ jobs.compute.outputs.digest }}
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Select build revision
        id: revision
        env:
          BUILD_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          revision="$BUILD_REVISION"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing or invalid tested revision"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  backend-quality:
    needs: resolve
    if: ${{ inputs.revision == '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TICKFLOW_ENV_FILE: /dev/null
      MULTITENANCY_ENABLED: "false"
      SERVICE_ROLE: standalone
      POLARS_MAX_THREADS: "4"
      TSP_TEST_POSTGRES_DSN: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fast repository checks
        working-directory: .
        run: make check
      - name: Set isolated test directory
        run: echo "DATA_DIR=$RUNNER_TEMP/tsp-tests" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - run: uv sync --extra dev --extra cell --frozen
      - run: uv run --frozen --no-sync python -m app.plugins.rustdx.client
      - run: uv run --frozen --no-sync pytest ../tests/tooling -q
      - run: PYO3_PYTHON="$PWD/.venv/bin/python" cargo test --locked --manifest-path native/rustdx_native/Cargo.toml
      - run: uv run --frozen --no-sync python ../scripts/vendor_rustdx.py
      - run: RUSTDX_SKIP_INTEGRATION_TESTS=1 cargo test --locked --manifest-path native/rustdx_native/vendor/rustdx-core/Cargo.toml
      - run: uv run --frozen --no-sync pytest tests -q
      - run: uv run --frozen --no-sync python -m scripts.acceptance.accept_local_web --output "$RUNNER_TEMP/local-web.json"

  frontend-quality:
    needs: resolve
    if: ${{ inputs.revision == '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  runtime:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.inputs.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Freeze base digests and source identity
        id: inputs
        env:
          BUILD_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          python3 scripts/check_version.py --current VERSION
          version="$(cat VERSION)"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release.common import file_hash, object_hash
          bases = {}
          for name, image in {
              "NODE_ALPINE_IMAGE": "docker.io/library/node:20-alpine",
              "NODE_IMAGE": "docker.io/library/node:20-bookworm-slim",
              "RUST_IMAGE": "docker.io/library/rust:1.99-slim-bookworm",
              "PYTHON_IMAGE": "docker.io/library/python:3.11-slim-bookworm",
          }.items():
              digest = subprocess.check_output([
                  "docker", "buildx", "imagetools", "inspect", image,
                  "--format", "{{.Manifest.Digest}}",
              ], text=True).strip()
              if len(digest) != 71 or not digest.startswith("sha256:"):
                  raise SystemExit("invalid base digest")
              bases[name] = image + "@" + digest
          names = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          files = {name: file_hash(Path(name)) for name in names if name}
          tree = object_hash(files)
          with open(os.environ["GITHUB_OUTPUT"], "a") as target:
              for name, value in {**bases, "source_tree": tree}.items():
                  target.write(name + "=" + value + "\n")
          Path(os.environ["RUNNER_TEMP"], "build-inputs.json").write_text(json.dumps({
              "revision": os.environ["BUILD_REVISION"], "source_tree_sha256": tree,
              "bases": bases, "lock_sha256": files["backend/uv.lock"],
              "python_abi": "cp311", "rust_toolchain": "1.99.0",
          }, indent=2) + "\n")
          PY
      - name: Build candidate Runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.inputs.outputs.image }}:ci-${{ github.run_id }}-${{ github.run_attempt }}-runtime
          build-args: |
            USE_CN_MIRROR=0
            SOURCE_COMMIT=${{ needs.resolve.outputs.revision }}
            SOURCE_TREE_SHA=${{ steps.inputs.outputs.source_tree }}
            NODE_ALPINE_IMAGE=${{ steps.inputs.outputs.NODE_ALPINE_IMAGE }}
            NODE_IMAGE=${{ steps.inputs.outputs.NODE_IMAGE }}
            RUST_IMAGE=${{ steps.inputs.outputs.RUST_IMAGE }}
            PYTHON_IMAGE=${{ steps.inputs.outputs.PYTHON_IMAGE }}
            NATIVE_CACHE_KEY=cp311-rust199-${{ hashFiles('backend/native/**') }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.revision }}
            org.opencontainers.image.version=${{ steps.inputs.outputs.version }}
            io.tsp.role=runtime
            io.tsp.source-tree=${{ steps.inputs.outputs.source_tree }}
          cache-from: type=gha,scope=tsp-runtime
          cache-to: type=gha,scope=tsp-runtime,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-inputs
          path: ${{ runner.temp }}/build-inputs.json
          if-no-files-found: error
          overwrite: true

  compute:
    needs: [resolve, runtime]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          version="$(cat VERSION)"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build candidate Compute from Runtime digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/full/Compute.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.runtime.outputs.image }}-compute:ci-${{ github.run_id }}-${{ github.run_attempt }}-compute
          build-args: |
            RUNTIME_IMAGE=${{ needs.runtime.outputs.image }}@${{ needs.runtime.outputs.digest }}
            USE_CN_MIRROR=0
            SOURCE_COMMIT=${{ needs.resolve.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            io.tsp.role=compute
          cache-from: type=gha,scope=tsp-compute
          cache-to: type=gha,scope=tsp-compute,mode=max

  identity:
    needs: [resolve, runtime, compute]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Verify complete image identity matrix
        env:
          OCI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_REGISTRY_USER: ${{ github.actor }}
          BUILD_REVISION: ${{ needs.resolve.outputs.revision }}
          RUNTIME_IMAGE: ${{ needs.runtime.outputs.image }}
          RUNTIME_DIGEST: ${{ needs.runtime.outputs.digest }}
          COMPUTE_DIGEST: ${{ needs.compute.outputs.digest }}
        run: |
          version="$(cat VERSION)"
          version="${version#v}"
          python3 scripts/release/image_manifest.py --version "$version" \
            --revision "$BUILD_REVISION" --runtime-image "$RUNTIME_IMAGE" \
            --runtime-digest "$RUNTIME_DIGEST" --compute-image "$RUNTIME_IMAGE-compute" \
            --compute-digest "$COMPUTE_DIGEST" --output "$RUNNER_TEMP/release-images.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: ${{ runner.temp }}/release-images.json
          if-no-files-found: error
          overwrite: true

  promote:
    needs: [resolve, backend-quality, frontend-quality, runtime, compute, identity]
    if: ${{ inputs.revision == '' }}
    uses: ./.github/workflows/docker-promote.yml
    with:
      revision: ${{ needs.resolve.outputs.revision }}
      runtime_digest: ${{ needs.runtime.outputs.digest }}
      compute_digest: ${{ needs.compute.outputs.digest }}
      promote_latest: false
    secrets: inherit
