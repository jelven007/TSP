name: CI

# 持续集成: 后端全量测试 + 前端全量测试与构建。
# 与 release.yml 的分工: 这里不打包, 只守质量门 —
# 后端含 Tier A 开放契约快照测试 (test_openapi_contract.py),
# 开放面的任何变化都会在这里被拦下, 须有意识地更新快照。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  # PR 可取消旧检查；每次 main 集成都必须保留自己的递增任务。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: PR 校验版本；远程 main 集成后自动递增
        id: revision
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # GITHUB_TOKEN 的自动提交不会再次触发 push workflow。
            python3 scripts/advance_version.py
          else
            python3 scripts/check_version.py --current VERSION
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              python3 scripts/check_version.py --branch-base "$PR_BASE" --branch-head "$PR_HEAD"
            fi
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录本次质量门实际检查的提交
        env:
          TESTED_REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-revision"
          printf '%s\n' "$TESTED_REVISION" > "$RUNNER_TEMP/ci-revision/revision.txt"
          printf 'Quality checks target commit: `%s`\n' "$TESTED_REVISION" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-revision
          path: ${{ runner.temp }}/ci-revision/revision.txt
          if-no-files-found: error
          overwrite: true

  backend:
    needs: version
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TICKFLOW_ENV_FILE: /dev/null
      MULTITENANCY_ENABLED: "false"
      SERVICE_ROLE: standalone
      POLARS_MAX_THREADS: "4"
      TSP_TEST_POSTGRES_DSN: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
      STATIC_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0

      - name: 设置隔离测试数据目录
        run: echo "DATA_DIR=$RUNNER_TEMP/tsp-tests" >> "$GITHUB_ENV"

      - name: 检查工程目录与关键入口
        working-directory: .
        run: python3 scripts/check_repository.py

      - name: 检查文档链接与需求契约
        working-directory: .
        run: python3 scripts/check_docs.py

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: 安装依赖 (含 dev、cell 测试链与 rustdx)
        run: uv sync --extra dev --extra cell --frozen

      - name: 增量 Ruff 门禁与公共缓存类型检查
        run: |
          uv run --frozen --no-sync python ../scripts/check_ruff_delta.py --base "$STATIC_BASE" --ruff "$PWD/.venv/bin/ruff"
          uv run --frozen --no-sync mypy app/services/public_query_cache.py --follow-imports=skip

      - name: 校验默认安装的 rustdx 原生桥接
        run: uv run --frozen --no-sync python -m app.plugins.rustdx.client

      - name: 版本规则测试
        run: uv run --frozen --no-sync pytest ../tests/tooling -q

      - name: 检查 rustdx 原生桥接
        run: PYO3_PYTHON="$PWD/.venv/bin/python" cargo test --locked --manifest-path native/rustdx_native/Cargo.toml

      - name: 检查固定 rustdx 核心与补丁身份
        run: |
          uv run --frozen --no-sync python ../scripts/vendor_rustdx.py
          RUSTDX_SKIP_INTEGRATION_TESTS=1 cargo test --locked --manifest-path native/rustdx_native/vendor/rustdx-core/Cargo.toml

      - name: 后端全量测试
        run: uv run --frozen --no-sync pytest tests -q

      - name: 隔离 Web HTTP 关键流程验收
        run: |
          uv run --frozen --no-sync python -m scripts.acceptance.accept_local_web --output "$RUNNER_TEMP/local-web-acceptance.json"
          python ../scripts/release/write_validation_record.py --output "$RUNNER_TEMP/validation-record.json" --evidence "local-web=$RUNNER_TEMP/local-web-acceptance.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-web-acceptance
          path: |
            ${{ runner.temp }}/local-web-acceptance.json
            ${{ runner.temp }}/validation-record.json
          if-no-files-found: warn

  frontend:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端全量测试
        run: pnpm test

      - name: 前端静态检查
        run: pnpm lint

      - name: 构建 (tsc + vite)
        run: pnpm build

  tag:
    needs: [version, backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
          fetch-depth: 0
          persist-credentials: true

      - name: 为通过质量门的主线提交创建版本标签
        id: tag
        env:
          TESTED_REVISION: ${{ needs.version.outputs.revision }}
        run: python3 scripts/tag_version.py "$TESTED_REVISION"

      - name: 记录版本标签
        env:
          VERSION_TAG: ${{ steps.tag.outputs.tag }}
          TESTED_REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          printf 'Version tag: `%s` → `%s`\n' "$VERSION_TAG" "$TESTED_REVISION" >> "$GITHUB_STEP_SUMMARY"
