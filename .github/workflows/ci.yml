name: CI

# 持续集成: 后端全量测试 + 前端全量测试与构建。
# 与 release.yml 的分工: 这里不打包, 只守质量门 —
# 后端含 Tier A 开放契约快照测试 (test_openapi_contract.py),
# 开放面的任何变化都会在这里被拦下, 须有意识地更新快照。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  # PR 可取消旧检查；每次 main 集成都必须保留自己的递增任务。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: PR 校验版本；远程 main 集成后自动递增
        id: revision
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # GITHUB_TOKEN 的自动提交不会再次触发 push workflow。
            python3 scripts/advance_version.py
          else
            python3 scripts/check_version.py --current VERSION
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              python3 scripts/check_version.py --branch-base "$PR_BASE" --branch-head "$PR_HEAD"
            fi
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录本次质量门实际检查的提交
        env:
          TESTED_REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-revision"
          printf '%s\n' "$TESTED_REVISION" > "$RUNNER_TEMP/ci-revision/revision.txt"
          printf 'Quality checks target commit: `%s`\n' "$TESTED_REVISION" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-revision
          path: ${{ runner.temp }}/ci-revision/revision.txt
          if-no-files-found: error
          overwrite: true

  backend:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: 安装依赖 (含 dev、cell 测试链与 rustdx)
        run: uv sync --extra dev --extra cell --frozen

      - name: 校验默认安装的 rustdx 原生桥接
        run: uv run --frozen --no-sync python -m app.plugins.rustdx.client

      - name: 版本规则测试
        run: uv run --frozen --no-sync pytest ../scripts/test_versioning.py ../scripts/test_advance_version.py ../scripts/test_tag_version.py ../scripts/test_collaborative_versioning.py ../scripts/test_version_workflows.py tests/test_version_source.py -q

      - name: 检查 rustdx 原生桥接
        run: cargo test --locked --manifest-path native/rustdx_native/Cargo.toml

      - name: 后端全量测试
        run: uv run --frozen --no-sync pytest tests -q

  frontend:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端全量测试
        run: pnpm test

      - name: 前端静态检查
        run: pnpm lint

      - name: 构建 (tsc + vite)
        run: pnpm build

  tag:
    needs: [version, backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.revision }}
          fetch-depth: 0
          persist-credentials: true

      - name: 为通过质量门的主线提交创建版本标签
        id: tag
        env:
          TESTED_REVISION: ${{ needs.version.outputs.revision }}
        run: python3 scripts/tag_version.py "$TESTED_REVISION"

      - name: 记录版本标签
        env:
          VERSION_TAG: ${{ steps.tag.outputs.tag }}
          TESTED_REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          printf 'Version tag: `%s` → `%s`\n' "$VERSION_TAG" "$TESTED_REVISION" >> "$GITHUB_STEP_SUMMARY"
